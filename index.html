<style>
:root{
  --desk:#f8f3ea; --paper:#fffefa; --paper2:#fbf4e4; --ink:#33302b; --muted:#6f6556; --line:#eadfc8;
  --accent:#b25c1e; --soft:#fdecd2; --gold:#c98a2b; --cov1:#fff6e0; --cov2:#f7d9a6; --covink:#8a4a1c;
}
:root[data-theme=dark]{--desk:#14110e; --paper:#2a2520; --paper2:#322c25; --ink:#f0e8da; --muted:#b0a591; --line:#463e33; --accent:#e2a362; --soft:#3d3123; --gold:#d6a85a; --cov1:#7a5038; --cov2:#3b2418; --covink:#e0b565;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--desk);color:var(--ink);font-family:'Nunito',system-ui,sans-serif;line-height:1.6;display:flex;flex-direction:column;align-items:center;overflow:hidden}
.shell{width:100%;max-width:560px;padding:12px 12px 8px;display:flex;flex-direction:column;height:100vh;height:100dvh}
.stage{flex:1;min-height:0;perspective:1800px;position:relative}
.book{position:absolute;inset:0;border-radius:6px 14px 14px 6px;box-shadow:0 14px 34px rgba(0,0,0,.28),0 2px 0 var(--line);background:var(--paper)}
.book::before{content:"";position:absolute;left:0;top:0;bottom:0;width:14px;z-index:5;pointer-events:none;border-radius:6px 0 0 6px;background:linear-gradient(90deg,rgba(0,0,0,.20),rgba(0,0,0,0))}
.pg{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;transform-origin:left center;backface-visibility:hidden;border-radius:6px 14px 14px 6px;background:var(--paper);-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.pg.top{z-index:2}
.inner{padding:26px 24px 40px 30px;min-height:100%}
.inner.cover{background:radial-gradient(circle at 30% 20%,var(--cov1),var(--cov2) 80%);color:var(--covink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer}
.cover .frame{border:2px solid var(--gold);outline:1px solid var(--gold);outline-offset:6px;border-radius:6px;padding:46px 22px;width:100%;max-width:340px}
.cover h1{font-family:'Lora',Georgia,serif;font-weight:600;font-size:2.4rem;margin:12px 0 6px;letter-spacing:.02em}
.cover .orn{font-size:2.4rem}
.cover p{margin:6px 0;opacity:.9}
.cover .open{margin-top:26px;font-size:.9rem;letter-spacing:.08em;text-transform:uppercase;animation:pulse 2.2s infinite}
@keyframes pulse{50%{opacity:.4}}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:10px}
.bar button{border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:999px;font:inherit;font-weight:700;padding:9px 16px;cursor:pointer;min-width:48px}
.bar button:disabled{opacity:.35}
#ind{color:var(--muted);font-size:.88rem}
h2.t{font-family:'Lora',Georgia,serif;font-size:1.5rem;margin:0 0 6px}
h3.t{font-family:'Lora',Georgia,serif;font-size:1.4rem;margin:2px 0 12px;line-height:1.3}
.tag{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--accent)}
.quote{font-family:'Lora',Georgia,serif;font-size:1.12rem;border-left:3px solid var(--gold);padding-left:14px;margin:0 0 12px}
.quote.q{font-style:italic}
.source{font-size:.86rem;color:var(--muted);margin:6px 0 14px}
.badge{display:inline-block;border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:.72rem;margin-left:6px;white-space:nowrap}
.refl{margin:10px 0}
.practice{background:var(--soft);border-radius:12px;padding:10px 14px;margin:12px 0}
.ejer{margin:8px 0 4px}
.ejer label{display:block;font-size:.85rem;color:var(--muted);margin-bottom:4px}
.ejer textarea{width:100%;min-height:96px;resize:vertical;border:1px solid var(--line);background:var(--paper);color:var(--ink);border-radius:10px;padding:10px;font:inherit;font-size:.95rem;line-height:1.5}
.ejer textarea:focus{outline:2px solid var(--gold);outline-offset:1px}
.ejer .st{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:var(--muted);margin-top:4px;gap:8px}
.also{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;align-items:center;font-size:.85rem;color:var(--muted)}
.mini{border:1px solid var(--line);background:var(--paper2);color:var(--ink);border-radius:999px;padding:3px 10px;font:inherit;font-size:.8rem;cursor:pointer}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:7px 14px;font:inherit;font-size:.9rem;cursor:pointer}
.btn.on{color:var(--accent);border-color:var(--accent);font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.search{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--paper2);color:var(--ink);font:inherit}
.search:focus,textarea:focus,select:focus{outline:2px solid var(--accent)}
.daily{background:var(--soft);border-radius:14px;padding:12px 14px;margin:12px 0}
.daily blockquote{font-family:'Lora',Georgia,serif;font-style:italic;margin:4px 0}
.list{list-style:none;padding:0;margin:8px 0}
.list li{margin:0}
.list button{width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;padding:11px 2px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.list small{color:var(--muted);white-space:nowrap}
.sec{display:flex;flex-direction:column;justify-content:center;min-height:calc(100% - 20px);text-align:center}
.sec .big{font-family:'Lora',Georgia,serif;font-size:2rem;margin:10px 0}
.sec .orn{color:var(--gold);font-size:1.8rem}
textarea,select{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--paper2);color:var(--ink);font:inherit;padding:10px}
textarea{min-height:110px;resize:vertical}
.entry{border-top:1px solid var(--line);padding:10px 0}
.entry small{color:var(--muted)}
.note{border:1px dashed var(--accent);border-radius:12px;padding:12px;font-size:.9rem;margin:14px 0}
.muted{color:var(--muted);font-size:.88rem}
.empty{color:var(--muted);text-align:center;padding:18px 0}
</style>
</head>

<script>
(function(){try{if(localStorage.getItem('luz-tema')==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();
document.addEventListener('DOMContentLoaded',function(){var b=document.getElementById('tema');if(!b)return;
 function sync(){var d=document.documentElement.getAttribute('data-theme')==='dark';b.textContent=d?'☀':'☾';var m=document.querySelector('meta[name=theme-color]');if(m)m.content=d?'#14110e':'#f8f3ea';}
 sync();b.onclick=function(){var d=document.documentElement.getAttribute('data-theme')==='dark';if(d)document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme','dark');try{localStorage.setItem('luz-tema',d?'light':'dark')}catch(e){}sync();};});
</script>
<script>
/* ---------- Capítulos (estados de ánimo) ---------- */
const MOODS = [
  {id:"tristeza", label:"Cuando estoy triste", intro:"La tristeza también es una maestra. Aquí, voces de muchas culturas que acompañan sin apurarte."},
  {id:"duelo", label:"Cuando perdí a alguien", intro:"El duelo es el precio del amor. Palabras para acompañar la ausencia, sin prisa ni deberes."},
  {id:"vacio", label:"Cuando no tengo ganas", intro:"Cuando todo pesa, lo pequeño cuenta. Ideas y prácticas para dar un primer paso."},
  {id:"amargura", label:"Cuando me siento amargado/a", intro:"El resentimiento cansa a quien lo carga. Lecturas para ablandar el corazón."},
  {id:"perdon", label:"Para perdonar y soltar", intro:"Perdonar es un proceso, no un favor al otro. Ideas de muchas tradiciones para aligerar la carga."},
  {id:"ira", label:"Cuando tengo rabia", intro:"La rabia es energía. Se trata de no dejar que maneje por ti."},
  {id:"culpa", label:"Quiero ser mejor persona", intro:"Cambiar siempre es posible. Reconocer el error es el comienzo, no el final."},
  {id:"ansiedad", label:"Cuando estoy ansioso/a", intro:"Volver al presente, al cuerpo, a lo que sí depende de ti."},
  {id:"paz", label:"Para encontrar paz", intro:"La calma se practica. Quietud, respiración y atención, en la voz de varias tradiciones."},
  {id:"soledad", label:"Cuando me siento solo/a", intro:"Somos seres de vínculo. Pequeños gestos que tienden puentes."},
  {id:"amor", label:"Para quererme mejor", intro:"Tratarte con la amabilidad que darías a un buen amigo no es egoísmo: es el comienzo."},
  {id:"sentido", label:"Para encontrar sentido", intro:"No hace falta tener todas las respuestas. Preguntas y brújulas para orientarse."},
  {id:"esperanza", label:"Para recuperar la esperanza", intro:"Lo que hoy pesa también cambia. Voces que recuerdan que se puede volver a levantar."},
  {id:"gratitud", label:"Para agradecer", intro:"Mirar lo que sí hay. Un hábito sencillo que cambia la mirada."}
];
const MOOD_LABEL = Object.fromEntries(MOODS.map(m=>[m.id,m.label]));

/* fid: 'textual' = texto de una traducción de dominio público; 'adaptación' = paráfrasis del sentido */
const DATA_FALLBACK = [
 {id:1,cats:['tristeza','soledad'],tipo:'frase',trad:'Tradición judía y cristiana',titulo:'Cerca de los quebrantados',
  texto:'Cercano está Jehová a los quebrantados de corazón; y salva a los contritos de espíritu.',
  fuente:'Salmo 34:18, Reina-Valera (1909)',fid:'textual',
  reflexion:'Los salmos nacieron como oraciones honestas de gente que sufría. No piden fingir alegría: ofrecen compañía en medio del dolor.',
  practica:'Escribe en una hoja lo que de verdad sientes, sin censura, como si se lo dijeras a alguien que te escucha con cariño.'},
 {id:2,cats:['tristeza'],tipo:'frase',trad:'Tradición judía y cristiana',titulo:'La noche no dura para siempre',
  texto:'Por la noche durará el lloro, y a la mañana vendrá la alegría.',
  fuente:'Salmo 30:5, Reina-Valera (1909)',fid:'textual',
  reflexion:'No dice que no habrá noche, dice que la noche tiene fin. Sentir tristeza es parte del camino, no el destino final.'},
 {id:30,cats:['tristeza','soledad'],tipo:'idea',trad:'Budismo',titulo:'La semilla de mostaza',
  texto:'Kisa Gotami, desesperada por la muerte de su hijo, pidió a Buda una medicina. Él le dijo que trajera una semilla de mostaza de una casa donde nadie hubiera perdido a un ser querido. Recorrió el pueblo y no la encontró. Entendió que no estaba sola en su dolor.',
  fuente:'Relato tradicional, comentario al Dhammapada (verso 114)',fid:'adaptación',
  reflexion:'El duelo es uno de los dolores más universales. Saber que otros han pasado por esto no lo quita, pero lo hace más compartido y llevadero.'},
 {id:31,cats:['tristeza','ansiedad'],tipo:'frase',trad:'Islam',titulo:'Con la dificultad viene la facilidad',
  texto:'En verdad, con la dificultad viene la facilidad. En verdad, con la dificultad viene la facilidad.',
  fuente:'Corán, sura 94 (Ash-Sharh), versículos 5-6',fid:'adaptación',
  reflexion:'El texto lo repite dos veces, como para que no quede duda: la dificultad no tiene la última palabra.'},
 {id:32,cats:['tristeza','vacio'],tipo:'frase',trad:'Hinduismo',titulo:'De la oscuridad a la luz',
  texto:'Condúceme de lo irreal a lo real, de la oscuridad a la luz, de la muerte a la inmortalidad.',
  fuente:'Brihadaranyaka Upanishad, 1.3.28',fid:'adaptación',
  reflexion:'Una plegaria muy antigua del hinduismo, que se repite todavía hoy. Habla del deseo humano de ir hacia la luz.'},
 {id:19,cats:['tristeza','vacio','ansiedad'],tipo:'practica',trad:'Sufismo',titulo:'Recibir las emociones como huéspedes',
  texto:'Tratar cada emoción como un visitante: darle la bienvenida, escucharla y dejar que se vaya a su tiempo, sin pelear con ella.',
  fuente:'Inspirada en el poema "La casa de huéspedes" de Rumi (Masnavi, s. XIII), versión libre',fid:'adaptación',
  reflexion:'Aceptar lo que sentimos no es resignarse; es dejar de gastar energía en negarlo.',
  practica:'Respira lento y di en voz baja: "Hay tristeza aquí. Te veo." Quédate un minuto con ella sin intentar arreglarla.'},
 {id:26,cats:['tristeza'],tipo:'idea',trad:'Literatura espiritual',titulo:'El dolor rompe la cáscara',
  texto:'Vuestro dolor es la rotura de la cáscara que encierra vuestro entendimiento.',
  fuente:'Khalil Gibran, El profeta, "Del dolor" (1923)',fid:'adaptación',
  reflexion:'Gibran sugiere que el sufrimiento, aunque duele, puede abrir una comprensión más profunda de la vida.'},

 {id:16,cats:['vacio','tristeza'],tipo:'frase',trad:'Taoísmo',titulo:'El primer paso',
  texto:'Un viaje de mil millas comienza con un solo paso.',
  fuente:'Lao Tse, Tao Te Ching, cap. 64',fid:'adaptación',
  reflexion:'Cuando todo pesa, lo que cuenta no es el gran cambio, sino un paso pequeño que sí se pueda dar hoy.',
  practica:'Elige una sola acción diminuta (abrir la ventana, beber agua, caminar cinco minutos, llamar a alguien) y hazla ahora.'},
 {id:17,cats:['vacio'],tipo:'idea',trad:'Psicología y filosofía',titulo:'La última libertad',
  texto:'Al ser humano se le puede quitar casi todo, menos una cosa: la libertad de elegir su actitud ante lo que le toca vivir.',
  fuente:'Viktor Frankl, El hombre en busca de sentido (idea central del libro)',fid:'adaptación',
  reflexion:'Frankl, psiquiatra que sobrevivió a los campos de concentración, concluyó que encontrar un sentido, aun en el sufrimiento, es lo que nos sostiene.',
  practica:'Pregúntate: ¿para quién o para qué vale la pena levantarme mañana? Aunque sea algo pequeño, escríbelo.'},
 {id:18,cats:['vacio','tristeza'],tipo:'practica',trad:'Psicología',titulo:'Activación paso a paso',
  texto:'Cuando faltan las ganas, esperar a sentirlas suele alargar el vacío. La psicología propone lo contrario: actuar primero, aunque sea poco, y dejar que el ánimo siga después.',
  fuente:'Activación conductual (Aaron T. Beck y otros; terapia cognitivo-conductual)',fid:'adaptación',
  reflexion:'No es un sustituto del tratamiento, pero es una herramienta respaldada por la investigación.',
  practica:'Planea tres actividades pequeñas para hoy: una de cuidado (ducha, comida), una con otra persona, una que antes disfrutabas. Táchalas al terminar.'},
 {id:33,cats:['vacio','ansiedad'],tipo:'frase',trad:'Judaísmo',titulo:'No te toca terminarlo todo',
  texto:'No te corresponde a ti terminar la tarea, pero tampoco eres libre de desentenderte de ella.',
  fuente:'Pirké Avot (Ética de los Padres), 2:16, Rabí Tarfón',fid:'adaptación',
  reflexion:'Alivia la presión de tener que resolverlo todo, sin dejar de hacer tu parte.'},
 {id:27,cats:['vacio','gratitud'],tipo:'frase',trad:'Hinduismo',titulo:'Derecho a la acción, no al fruto',
  texto:'Tu derecho es a la acción, no a sus frutos. No te muevas por el fruto ni te aferres a la inacción.',
  fuente:'Bhagavad Gita, 2:47',fid:'adaptación',
  reflexion:'Hacer lo correcto con lo que tenemos a mano, sin esperar aplausos ni resultados, libera de mucha ansiedad.'},

 {id:7,cats:['amargura','ira','culpa'],tipo:'frase',trad:'Budismo',titulo:'El odio no se vence con odio',
  texto:'El odio nunca se apaga con odio; solo se apaga con amor. Esta es una ley eterna.',
  fuente:'Dhammapada, verso 5 (Buda)',fid:'adaptación',
  reflexion:'Una de las enseñanzas más reconocidas del budismo: cada respuesta rencorosa alimenta el fuego que decimos querer apagar.'},
 {id:11,cats:['amargura','ira','culpa'],tipo:'idea',trad:'Estoicismo',titulo:'Cada quien actúa desde su ignorancia',
  texto:'Al amanecer, dite a ti mismo: hoy me encontraré con gente entrometida, ingrata, arrogante, falsa, envidiosa, antisocial. Todo eso les viene de ignorar lo que es bueno y lo que es malo.',
  fuente:'Marco Aurelio, Meditaciones, II, 1',fid:'adaptación',
  reflexion:'Marco Aurelio, emperador romano, escribía para sí mismo. No justifica el daño, pero ayuda a no tomarlo todo de forma tan personal ni a vivir en resentimiento.'},
 {id:34,cats:['amargura','culpa'],tipo:'frase',trad:'Judaísmo',titulo:'¿Quién es sabio? ¿Quién es rico?',
  texto:'¿Quién es sabio? El que aprende de todos. ¿Quién es fuerte? El que domina su impulso. ¿Quién es rico? El que se alegra con lo que tiene. ¿Quién es digno de honor? El que honra a los demás.',
  fuente:'Pirké Avot (Ética de los Padres), 4:1',fid:'adaptación',
  reflexion:'Cuatro preguntas que dan vuelta a lo que solemos valorar. La amargura suele nacer de comparar; esta mirada propone otra medida.'},
 {id:28,cats:['amargura','culpa','ira'],tipo:'frase',trad:'Taoísmo',titulo:'Conocerse es lo más difícil',
  texto:'Conocer a los demás es sabiduría; conocerse a uno mismo es iluminación. Vencer a otros es fuerza; vencerse a uno mismo es verdadero poder.',
  fuente:'Lao Tse, Tao Te Ching, cap. 33',fid:'adaptación',
  reflexion:'El cambio personal empieza mirándose con honestidad, sin excusas y sin autodesprecio.',
  practica:'Escribe una sola cosa de ti que quisieras mejorar, sin juzgarte, y una acción mínima que podrías hacer esta semana.'},
 {id:21,cats:['soledad','amargura','culpa'],tipo:'practica',trad:'Budismo y ciencia contemplativa',titulo:'Meditación de bondad amorosa (Metta)',
  texto:'Repite en silencio, primero para ti y luego para alguien querido, alguien neutro y, si puedes, alguien difícil: "Que seas feliz. Que estés en paz. Que estés libre de sufrimiento."',
  fuente:'Tradición budista, Metta Sutta (Sutta Nipata 1.8); estudios modernos, p. ej. Fredrickson et al., 2008',fid:'adaptación',
  reflexion:'Es una práctica milenaria para ablandar el corazón y soltar el rencor, también hacia uno mismo.',
  practica:'Dedícale cinco minutos al día durante una semana, y observa cómo cambia tu trato hacia ti y hacia los demás.'},

 {id:8,cats:['ira','amargura'],tipo:'frase',trad:'Budismo',titulo:'Vence la ira con calma',
  texto:'Vence la ira con la no ira; vence el mal con el bien; vence al avaro con la generosidad y al mentiroso con la verdad.',
  fuente:'Dhammapada, verso 223 (Buda)',fid:'adaptación',
  reflexion:'No se trata de reprimir la rabia, sino de no dejar que sea ella quien decida lo que haces.'},
 {id:9,cats:['ira'],tipo:'frase',trad:'Estoicismo',titulo:'La demora, el mejor remedio',
  texto:'El mayor remedio de la ira es la dilación.',
  fuente:'Séneca, Sobre la ira (De ira), libro II',fid:'adaptación',
  reflexion:'Séneca propone esperar. La rabia es muy intensa al principio y se reduce con el tiempo.',
  practica:'Antes de responder o actuar con enojo, espera diez respiraciones lentas. Si puedes, camina un rato antes de decidir qué hacer.'},
 {id:10,cats:['ira'],tipo:'frase',trad:'Tradición judía y cristiana',titulo:'La respuesta suave',
  texto:'La blanda respuesta quita la ira; mas la palabra áspera hace subir el furor.',
  fuente:'Proverbios 15:1, Reina-Valera (1909)',fid:'textual',
  reflexion:'Una frase breve de sabiduría práctica: la manera en que respondemos puede apagar o encender el conflicto.'},

 {id:12,cats:['culpa'],tipo:'frase',trad:'Budismo',titulo:'Una luz que sale de las nubes',
  texto:'Quien cubre con buenas acciones el mal que hizo ilumina este mundo como la luna libre de nubes.',
  fuente:'Dhammapada, verso 173 (Buda)',fid:'adaptación',
  reflexion:'Haber hecho daño no cierra la puerta para siempre. La tradición budista reconoce que cambiar es posible, y que se demuestra con actos.'},
 {id:13,cats:['culpa','amargura'],tipo:'idea',trad:'Budismo',titulo:'Angulimala: nadie está perdido',
  texto:'En la tradición budista se cuenta de Angulimala, un hombre temido por sus crímenes, que se encontró con Buda, cambió de vida y terminó viviendo con humildad y paz.',
  fuente:'Majjhima Nikāya 86 (Angulimala Sutta)',fid:'adaptación',
  reflexion:'La historia afirma que el pasado pesa, pero no define por completo a una persona. La puerta del cambio siempre se mantiene abierta.'},
 {id:14,cats:['culpa'],tipo:'practica',trad:'Estoicismo y espiritualidad ignaciana',titulo:'Examen de la noche',
  texto:'Al final del día, dedica cinco minutos a repasar: ¿Cuándo me sentí en paz? ¿Cuándo fui duro o injusto con alguien? ¿Qué quiero hacer distinto mañana?',
  fuente:'Inspirado en el Examen de Ignacio de Loyola, Ejercicios Espirituales (s. XVI), y en la práctica estoica (Séneca, Sobre la ira, III, 36)',fid:'adaptación',
  reflexion:'Es un repaso honesto y sin látigo: reconocer, agradecer, pedir perdón si hace falta y proponerse algo pequeño y concreto para mañana.',
  practica:'Hazlo hoy antes de dormir, con una libreta. Termina siempre con una cosa por la que dar gracias.'},
 {id:15,cats:['culpa'],tipo:'frase',trad:'Confucianismo',titulo:'La regla de reciprocidad',
  texto:'Lo que no deseas para ti, no lo hagas a los demás.',
  fuente:'Confucio, Analectas, XV, 24',fid:'adaptación',
  reflexion:'Una guía de conducta que aparece, con palabras distintas, en casi todas las tradiciones espirituales.'},
 {id:35,cats:['culpa','amargura'],tipo:'frase',trad:'Islam',titulo:'Desear para el otro lo que deseas para ti',
  texto:'Ninguno de vosotros cree de verdad hasta que desea para su hermano lo que desea para sí mismo.',
  fuente:'Hadiz recogido por al-Bujari y Muslim (Cuarenta Hadices de an-Nawawi, nº 13)',fid:'adaptación',
  reflexion:'Otra versión de la regla de oro: ver al otro como a uno mismo es la base de tratar bien a las personas.'},
 {id:36,cats:['culpa','tristeza'],tipo:'frase',trad:'Psicología humanista',titulo:'La paradoja de aceptarse',
  texto:'La curiosa paradoja es que cuando me acepto tal como soy, entonces puedo cambiar.',
  fuente:'Carl Rogers, El proceso de convertirse en persona (On Becoming a Person, 1961)',fid:'adaptación',
  reflexion:'Cambiar por desprecio a uno mismo suele durar poco. Cambiar desde la aceptación abre más posibilidades.'},
 {id:25,cats:['tristeza','culpa','vacio'],tipo:'practica',trad:'Psicología',titulo:'Hablarte como a un buen amigo',
  texto:'Cuando te equivoques o sufras, di: "Esto es difícil. Todos pasamos por momentos así. ¿Qué necesito ahora?"',
  fuente:'Kristin Neff, "Self-Compassion", Self and Identity, 2003',fid:'adaptación',
  reflexion:'La autocompasión no es indulgencia: la investigación asocia tratarse con amabilidad a mayor motivación para mejorar.',
  practica:'Pon la mano sobre el corazón y repite esas tres frases despacio.'},

 {id:3,cats:['ansiedad','tristeza'],tipo:'idea',trad:'Estoicismo',titulo:'No es la cosa, es lo que pensamos de ella',
  texto:'Lo que perturba a las personas no son las cosas, sino las opiniones que se forman sobre ellas.',
  fuente:'Epicteto, Enquiridión, 5',fid:'adaptación',
  reflexion:'Epicteto, antiguo maestro estoico, nos invita a separar los hechos de la historia que nos contamos. Muchas veces el sufrimiento mayor está en la interpretación.',
  practica:'Escribe dos columnas: "Lo que pasó" (solo hechos) y "Lo que me estoy diciendo". Mira cuánto de la segunda es opinión.'},
 {id:4,cats:['ansiedad'],tipo:'frase',trad:'Estoicismo',titulo:'Sufrimos más en la imaginación',
  texto:'Sufrimos más a menudo en la imaginación que en la realidad.',
  fuente:'Séneca, Cartas a Lucilio, Carta 13',fid:'adaptación',
  reflexion:'Gran parte de la ansiedad es un ensayo mental de desgracias que quizá nunca lleguen.',
  practica:'Pregúntate: ¿qué está pasando realmente en este momento? Nombra tres cosas que ves, dos que oyes y una que sientes en el cuerpo.'},
 {id:5,cats:['ansiedad'],tipo:'frase',trad:'Tradición cristiana',titulo:'Un día a la vez',
  texto:'Así que no os afanéis por el día de mañana, pues el día de mañana traerá su afán. Basta a cada día su propio mal.',
  fuente:'Mateo 6:34, Reina-Valera (1909)',fid:'textual',
  reflexion:'Una invitación antigua a bajar el ritmo del pensamiento y ocuparse de lo que sí se puede hacer hoy.'},
 {id:37,cats:['ansiedad'],tipo:'frase',trad:'Islam',titulo:'El sosiego del corazón',
  texto:'En el recuerdo de Dios los corazones encuentran sosiego.',
  fuente:'Corán, sura 13 (Ar-Ra’d), versículo 28',fid:'adaptación',
  reflexion:'Para muchas personas, una pausa de oración o recogimiento calma el cuerpo y el pensamiento. Cada quien puede encontrar su propia forma de hacerlo.'},
 {id:24,cats:['ansiedad','tristeza','ira'],tipo:'practica',trad:'Práctica contemplativa',titulo:'Respiración de calma',
  texto:'Inhala contando hasta 4, sostén un instante, exhala lentamente contando hasta 6 u 8. Repite durante dos o tres minutos.',
  fuente:'Respiración diafragmática lenta, presente en prácticas contemplativas (p. ej. pranayama) y en terapias de relajación',fid:'adaptación',
  reflexion:'Alargar la exhalación ayuda al cuerpo a pasar de alerta a calma.',
  practica:'Pon una mano en el abdomen y siente cómo sube y baja. Si te mareas, vuelve a un ritmo normal.'},
 {id:38,cats:['ansiedad','tristeza'],tipo:'practica',trad:'Mindfulness',titulo:'Espacio de respiración de tres minutos',
  texto:'1) Pregúntate qué estás sintiendo y pensando, sin cambiar nada. 2) Lleva toda tu atención a la respiración. 3) Abre la atención al cuerpo entero.',
  fuente:'Segal, Williams y Teasdale, Mindfulness-Based Cognitive Therapy for Depression (2002)',fid:'adaptación',
  reflexion:'Es un minirretiro para el día a día: se puede hacer en el trabajo, en el bus o antes de una conversación difícil.',
  practica:'Pon un recordatorio en tu teléfono a media mañana y a media tarde para hacer esta pausa.'},
 {id:23,cats:['gratitud','ira','ansiedad'],tipo:'idea',trad:'Estoicismo',titulo:'Querer lo que sucede',
  texto:'No pidas que las cosas sucedan como tú quieres; desea que sucedan como suceden y tu vida será serena.',
  fuente:'Epicteto, Enquiridión, 8',fid:'adaptación',
  reflexion:'Una invitación a distinguir lo que depende de nosotros de lo que no. La paz empieza por esa distinción.',
  practica:'Haz dos listas sobre lo que te inquieta: "Depende de mí" y "No depende de mí". Actúa solo sobre la primera.'},

 {id:20,cats:['soledad'],tipo:'frase',trad:'Tradición judía y cristiana',titulo:'Mejores son dos',
  texto:'Mejores son dos que uno; porque tienen mejor paga de su trabajo. Porque si cayeren, el uno levantará a su compañero.',
  fuente:'Eclesiastés 4:9-10, Reina-Valera (1909)',fid:'textual',
  reflexion:'Los humanos necesitamos vínculos. Pedir y ofrecer compañía es un acto de valentía, no de debilidad.',
  practica:'Escribe hoy un mensaje corto a una persona: "Pensé en ti, ¿cómo estás?". No necesita más.'},
 {id:39,cats:['soledad','culpa'],tipo:'frase',trad:'Tradición africana (nguni)',titulo:'Ubuntu: somos con los demás',
  texto:'Una persona es persona a través de otras personas.',
  fuente:'Proverbio nguni (zulú: "Umuntu ngumuntu ngabantu"), filosofía Ubuntu',fid:'adaptación',
  reflexion:'En la visión Ubuntu nadie se hace persona solo. Nuestra humanidad se construye y se cuida en comunidad.'},

 {id:22,cats:['gratitud','tristeza','amargura'],tipo:'practica',trad:'Psicología positiva',titulo:'Tres cosas buenas',
  texto:'Cada noche escribe tres cosas, por pequeñas que sean, por las que estás agradecido hoy.',
  fuente:'Emmons y McCullough, "Counting Blessings Versus Burdens", Journal of Personality and Social Psychology, 2003',fid:'adaptación',
  reflexion:'En ese estudio, las personas que escribían gratitudes con regularidad reportaron mejor ánimo y más optimismo que quienes anotaban molestias.',
  practica:'Empieza hoy mismo. Añade un "porque…": ¿por qué esa cosa fue buena?'},
 {id:40,cats:['gratitud','culpa'],tipo:'frase',trad:'Filosofía romana',titulo:'La madre de las virtudes',
  texto:'La gratitud no es solo la mayor de las virtudes, sino la madre de todas las demás.',
  fuente:'Cicerón, En defensa de Plancio (Pro Plancio), 80',fid:'adaptación',
  reflexion:'Cicerón la pone en el origen de la vida buena: quien reconoce lo recibido tiende a dar.'},
  {"cats": ["duelo"], "tipo": "frase", "trad": "Tradición judía y cristiana", "titulo": "Tiempo de llorar", "texto": "Tiempo de llorar, y tiempo de reír; tiempo de endechar, y tiempo de bailar.", "fuente": "Eclesiastés 3:4, Reina-Valera (1909)", "fid": "textual", "reflexion": "El duelo no se apresura ni se salta: hay un tiempo para llorar y, más adelante, otro para que la vida vuelva a abrirse.", "practica": "Dale hoy un momento al llanto sin juzgarlo: pon música suave, mira una foto o quédate unos minutos en silencio."},
  {"cats": ["duelo", "tristeza"], "tipo": "frase", "trad": "Tradición judía y cristiana", "titulo": "No estar solo en el valle", "texto": "Aunque ande en valle de sombra de muerte, no temeré mal alguno; porque tú estarás conmigo.", "fuente": "Salmo 23:4, Reina-Valera (1909)", "fid": "textual", "reflexion": "Uno de los textos de consuelo más citados ante una pérdida. No promete evitar el valle, sino no atravesarlo en soledad."},
  {"cats": ["duelo", "gratitud"], "tipo": "idea", "trad": "Estoicismo", "titulo": "No lo perdí: lo devolví", "texto": "Nunca digas de nada «lo he perdido», sino «lo he devuelto».", "fuente": "Epicteto, Enquiridión, 11", "fid": "adaptación", "reflexion": "Epicteto propone mirar lo que amamos como algo prestado. No quita el dolor, pero puede sumar gratitud por haberlo tenido.", "practica": "Escribe tres cosas por las que agradeces haber compartido la vida con esa persona."},
  {"cats": ["duelo"], "tipo": "frase", "trad": "Budismo", "titulo": "Todo lo compuesto es pasajero", "texto": "Todas las cosas compuestas son pasajeras; quien lo comprende con sabiduría se aparta del sufrimiento.", "fuente": "Dhammapada, verso 277", "fid": "adaptación", "reflexion": "No se trata de dejar de sentir, sino de entender que el cambio forma parte de todo lo que vive, incluidos nosotros."},
  {"cats": ["duelo"], "tipo": "idea", "trad": "Literatura espiritual", "titulo": "Fundirse con el sol", "texto": "¿Qué es morir sino quedarse desnudo en el viento y fundirse con el sol?", "fuente": "Khalil Gibran, El profeta, «De la muerte» (1923)", "fid": "adaptación", "reflexion": "Gibran describe la muerte como una disolución luminosa y no como un final oscuro. Una imagen que a muchas personas les da paz."},
  {"cats": ["duelo"], "tipo": "frase", "trad": "Islam", "titulo": "De Dios somos y a Él volvemos", "texto": "Somos de Dios y a Él regresamos.", "fuente": "Corán, sura 2 (Al-Baqara), versículo 156", "fid": "adaptación", "reflexion": "Muchas personas musulmanas pronuncian esta frase al recibir una pérdida; ofrece un marco para aceptar lo que no se puede cambiar."},
  {"cats": ["duelo"], "tipo": "frase", "trad": "Judaísmo", "titulo": "Que su memoria sea una bendición", "texto": "Que su memoria sea una bendición.", "fuente": "Expresión tradicional judía (Zijrono livrajá)", "fid": "adaptación", "reflexion": "En lugar de cerrar el recuerdo, la frase lo convierte en algo que sigue dando bien a quienes quedan.", "practica": "Cuéntale hoy a alguien una anécdota querida de esa persona, o escríbela para guardarla."},
  {"cats": ["duelo", "tristeza"], "tipo": "practica", "trad": "Psicología", "titulo": "Escribir sobre lo que pesa", "texto": "Escribe de 15 a 20 minutos, cuatro días seguidos, sobre lo que sientes por tu pérdida, sin cuidar la ortografía ni pensar en que alguien lo lea.", "fuente": "Pennebaker y Beall, «Confronting a traumatic event», Journal of Abnormal Psychology, 1986", "fid": "adaptación", "reflexion": "En ese estudio, quienes escribieron sobre lo más difícil que habían vivido acudieron menos al centro de salud en los meses siguientes.", "practica": "Si en algún momento te desborda, detente y busca el apoyo de alguien de confianza o de un profesional."},
  {"cats": ["duelo"], "tipo": "idea", "trad": "Psicología", "titulo": "El duelo va y viene", "texto": "El duelo suele oscilar: hay momentos de enfrentar la pérdida y momentos de descansar de ella haciendo otras cosas. Ambos son necesarios.", "fuente": "Stroebe y Schut, «The dual process model of coping with bereavement», Death Studies, 1999", "fid": "adaptación", "reflexion": "Distraerte un rato no es olvidar ni traicionar a quien se fue; es parte de cómo la mente sostiene el dolor.", "practica": "Si hoy toca descansar del dolor, permítelo sin culpa; si toca llorar, también."},
  {"cats": ["perdon", "amargura"], "tipo": "frase", "trad": "Budismo", "titulo": "Repasar la ofensa", "texto": "«Me insultó, me golpeó, me venció, me robó»: quien guarda esos pensamientos no se libra del odio.", "fuente": "Dhammapada, verso 3 (Buda)", "fid": "adaptación", "reflexion": "Repasar una y otra vez la ofensa mantiene viva la herida. Soltar empieza por notar cuánto espacio le damos a esa historia.", "practica": "Cuando notes que la repites, dite «ya la conozco» y lleva la atención a lo que tienes delante."},
  {"cats": ["perdon"], "tipo": "frase", "trad": "Tradición cristiana", "titulo": "No saben lo que hacen", "texto": "Padre, perdónalos, porque no saben lo que hacen.", "fuente": "Lucas 23:34", "fid": "adaptación", "reflexion": "Una de las expresiones de perdón más conocidas de la tradición cristiana. Mira al otro desde su ceguera, no desde su maldad."},
  {"cats": ["perdon", "ira"], "tipo": "frase", "trad": "Islam", "titulo": "Quien perdona y se reconcilia", "texto": "La retribución de un mal es un mal igual; pero quien perdona y se reconcilia, su recompensa corre por cuenta de Dios.", "fuente": "Corán, sura 42 (Ash-Shura), versículo 40", "fid": "adaptación", "reflexion": "Reconoce el derecho a reclamar justicia y, al mismo tiempo, valora más el perdón."},
  {"cats": ["perdon"], "tipo": "frase", "trad": "Islam", "titulo": "Responde con lo mejor", "texto": "Repele el mal con lo que sea mejor, y verás que aquel con quien había enemistad se vuelve como un amigo cercano.", "fuente": "Corán, sura 41 (Fussilat), versículo 34", "fid": "adaptación", "reflexion": "Una invitación a romper la cadena de agravios: a veces la bondad desarma lo que la respuesta dura solo endurece."},
  {"cats": ["perdon"], "tipo": "idea", "trad": "Judaísmo", "titulo": "Fácil de apaciguar", "texto": "No conviene ser cruel ni negarse a perdonar; conviene ser difícil de enojar y fácil de apaciguar.", "fuente": "Maimónides, Mishné Torá, Leyes de Teshuvá, 2:10", "fid": "adaptación", "reflexion": "Maimónides habla de perdonar a quien pide perdón con sinceridad. Es una guía de carácter: tardar en enojarse y estar dispuesto a la paz."},
  {"cats": ["perdon", "amargura"], "tipo": "frase", "trad": "Taoísmo", "titulo": "Responder al rencor con bondad", "texto": "Responde al rencor con bondad.", "fuente": "Lao Tse, Tao Te Ching, cap. 63", "fid": "adaptación", "reflexion": "Una frase breve que propone lo inesperado: cortar el círculo del daño con una respuesta que no lo alimenta."},
  {"cats": ["perdon", "ira"], "tipo": "frase", "trad": "Estoicismo", "titulo": "La mejor venganza", "texto": "La mejor venganza es no parecerte a quien te hizo daño.", "fuente": "Marco Aurelio, Meditaciones, VI, 6", "fid": "adaptación", "reflexion": "Responder con la misma moneda nos vuelve parecidos a quien nos lastimó. Conservar nuestra forma de ser es una manera de no perder."},
  {"cats": ["perdon"], "tipo": "practica", "trad": "Psicología", "titulo": "REACH: cinco pasos para perdonar", "texto": "Recordar la ofensa con honestidad, sin dramatizar. Empatizar, intentando entender al otro. Dar un regalo altruista: recordar una vez que a ti te perdonaron. Comprometerte a perdonar, por escrito. Sostener ese perdón cuando el rencor regrese.", "fuente": "Everett Worthington, Forgiving and Reconciling (2003)", "fid": "adaptación", "reflexion": "El perdón es un proceso. Es normal que el enojo vuelva y haya que renovar la decisión.", "practica": "Empieza hoy por el primer paso: escribe en pocas líneas lo que pasó, sin adjetivos."},
  {"cats": ["perdon", "amargura"], "tipo": "idea", "trad": "Psicología", "titulo": "Perdonar no es justificar", "texto": "Perdonar no es justificar, olvidar ni reconciliarse a la fuerza: es decidir soltar el resentimiento y, si se puede, ofrecer una mirada de buena voluntad hacia quien hizo daño.", "fuente": "Robert Enright, Forgiveness Is a Choice (2001)", "fid": "adaptación", "reflexion": "Puedes perdonar y, al mismo tiempo, poner límites o mantener distancia con quien te lastimó."},
  {"cats": ["sentido", "vacio"], "tipo": "idea", "trad": "Psicología y filosofía", "titulo": "Un porqué para vivir", "texto": "Quien tiene un porqué para vivir puede soportar casi cualquier cómo.", "fuente": "Friedrich Nietzsche, Crepúsculo de los ídolos, Máximas y flechas, 12; citada por Viktor Frankl en El hombre en busca de sentido", "fid": "adaptación", "reflexion": "Frankl la usó para explicar por qué algunas personas resistieron las peores condiciones: tenían algo por lo cual seguir.", "practica": "Completa la frase: «Mi razón para levantarme mañana es…». Si hoy no la ves, anota qué cosa pequeña podría serlo."},
  {"cats": ["sentido"], "tipo": "idea", "trad": "Tradición japonesa", "titulo": "Ikigai: lo que vale la pena de cada día", "texto": "En Japón se habla de ikigai: aquello que da sentido y alegría a levantarse cada día. Puede ser algo grande o muy sencillo, como cuidar un jardín, cocinar para alguien o aprender algo.", "fuente": "Mieko Kamiya, Ikigai-ni-tsuite (Sobre el sentido de vivir), 1966; García y Miralles, Ikigai (2016)", "fid": "adaptación", "reflexion": "La idea invita a mirar lo cotidiano: el sentido no siempre está en una gran misión, sino en lo que hacemos con cariño.", "practica": "Anota tres actividades en las que el tiempo pasa sin que lo notes."},
  {"cats": ["sentido"], "tipo": "frase", "trad": "Hinduismo", "titulo": "Tu propio camino, aunque imperfecto", "texto": "Es mejor cumplir la propia tarea con imperfección que la ajena a la perfección.", "fuente": "Bhagavad Gita, 3:35", "fid": "adaptación", "reflexion": "Menos comparación y más fidelidad a tu propio camino: nadie puede vivir tu vida mejor que tú."},
  {"cats": ["sentido", "ansiedad"], "tipo": "frase", "trad": "Judaísmo", "titulo": "Si no ahora, ¿cuándo?", "texto": "Si yo no soy para mí, ¿quién lo será? Y si soy solo para mí, ¿qué soy? Y si no es ahora, ¿cuándo?", "fuente": "Pirké Avot (Ética de los Padres), 1:14, Hilel", "fid": "adaptación", "reflexion": "Tres preguntas que equilibran cuidarse a uno mismo, servir a los demás y no postergar lo importante."},
  {"cats": ["sentido"], "tipo": "idea", "trad": "Filosofía griega", "titulo": "La felicidad como actividad", "texto": "La felicidad es una actividad del alma de acuerdo con la virtud.", "fuente": "Aristóteles, Ética a Nicómaco, I, 7", "fid": "adaptación", "reflexion": "Para Aristóteles no es un estado pasivo ni un premio: se construye haciendo cosas valiosas, con constancia."},
  {"cats": ["sentido", "vacio"], "tipo": "practica", "trad": "Psicología", "titulo": "Tres valores y un paso", "texto": "Escribe tres valores que quieras que guíen tu vida (por ejemplo: cuidar, aprender, ser honesto) y una acción pequeña que puedas hacer hoy en coherencia con cada uno.", "fuente": "Hayes, Strosahl y Wilson, Terapia de aceptación y compromiso (1999)", "fid": "adaptación", "reflexion": "Los valores son una brújula, no una meta que se alcanza. Actuar con ellos, aunque sea poco, da dirección aun cuando falten las ganas."},
  {"cats": ["sentido", "ansiedad"], "tipo": "idea", "trad": "Literatura espiritual", "titulo": "Amar las preguntas", "texto": "Ten paciencia con todo lo no resuelto en tu corazón e intenta amar las preguntas mismas.", "fuente": "Rainer Maria Rilke, Cartas a un joven poeta, Carta 4 (1903)", "fid": "adaptación", "reflexion": "No todo se aclara de inmediato. A veces vivir las preguntas es lo que nos acerca poco a poco a las respuestas."},
  {"cats": ["sentido", "vacio"], "tipo": "idea", "trad": "Psicología", "titulo": "El flujo: perderse en lo que haces", "texto": "El flujo es ese estado en que estamos tan absortos en una actividad que se nos olvida el tiempo. Aparece cuando el reto está a la altura de nuestra habilidad.", "fuente": "Mihaly Csikszentmihalyi, Flow (1990)", "fid": "adaptación", "reflexion": "Es una de las fuentes de bienestar más estudiadas: no depende de tener más, sino de involucrarnos de lleno en lo que hacemos.", "practica": "Elige hoy una actividad que te absorba (cocinar, dibujar, armar algo) y dale 30 minutos sin pantallas."},
  {"cats": ["sentido"], "tipo": "idea", "trad": "Confucianismo", "titulo": "Cada etapa tiene su tiempo", "texto": "A los quince me dediqué a estudiar; a los treinta me afirmé; a los cuarenta no tuve dudas; a los cincuenta conocí mi vocación; a los sesenta mi oído fue dócil; a los setenta seguía mis deseos sin salirme de lo justo.", "fuente": "Confucio, Analectas, II, 4", "fid": "adaptación", "reflexion": "El sentido madura con los años. No hace falta tenerlo todo claro hoy: cada etapa trae su aprendizaje."},
  {"cats": ["esperanza", "tristeza"], "tipo": "frase", "trad": "Tradición judía y cristiana", "titulo": "Nuevas cada mañana", "texto": "Nunca se agotan sus misericordias; nuevas son cada mañana.", "fuente": "Lamentaciones 3:22-23", "fid": "adaptación", "reflexion": "Escrito en medio de una gran ruina, este texto afirma que cada día trae una nueva oportunidad."},
  {"cats": ["esperanza"], "tipo": "frase", "trad": "Tradición judía y cristiana", "titulo": "Renovar las fuerzas", "texto": "Los que esperan en el Señor renovarán sus fuerzas; levantarán alas como águilas; correrán sin cansarse y caminarán sin fatigarse.", "fuente": "Isaías 40:31", "fid": "adaptación", "reflexion": "Un texto para cuando el cansancio parece definitivo: las fuerzas también se renuevan."},
  {"cats": ["esperanza"], "tipo": "frase", "trad": "Islam", "titulo": "No desesperéis", "texto": "No desesperéis de la misericordia de Dios.", "fuente": "Corán, sura 39 (Az-Zumar), versículo 53", "fid": "adaptación", "reflexion": "Una invitación directa a no darse por vencido, incluso después de equivocarse o de caer muy hondo."},
  {"cats": ["esperanza", "tristeza"], "tipo": "frase", "trad": "Hinduismo", "titulo": "Placer y dolor vienen y van", "texto": "El placer y el dolor, el frío y el calor, vienen y se van; son pasajeros. Aprende a soportarlos.", "fuente": "Bhagavad Gita, 2:14", "fid": "adaptación", "reflexion": "Saber que lo que sentimos cambia puede darnos aire cuando el dolor parece eterno."},
  {"cats": ["esperanza"], "tipo": "idea", "trad": "Tradición japonesa", "titulo": "Kintsugi: las grietas con oro", "texto": "En el kintsugi, una antigua técnica japonesa, la cerámica rota se repara con laca mezclada con oro, y la grieta pasa a ser parte de la belleza de la pieza.", "fuente": "Técnica tradicional japonesa (siglo XV)", "fid": "adaptación", "reflexion": "Una imagen para pensar en nuestras cicatrices: no tienen que esconderse para que seamos valiosos.", "practica": "Piensa en algo que te quebró y hoy te enseñó algo. Escríbelo en una sola línea."},
  {"cats": ["esperanza"], "tipo": "frase", "trad": "Tradición japonesa", "titulo": "Siete caídas, ocho levantadas", "texto": "Siete veces cae, ocho veces se levanta.", "fuente": "Proverbio japonés (nana korobi ya oki)", "fid": "adaptación", "reflexion": "Lo que cuenta no es no caer, sino volver a ponerse en pie una vez más de las que caímos."},
  {"cats": ["esperanza"], "tipo": "idea", "trad": "Psicología", "titulo": "La resiliencia es más común de lo que parece", "texto": "La mayoría de las personas que atraviesan una pérdida o un hecho muy difícil se recuperan con el tiempo; la resiliencia es más común de lo que solemos creer.", "fuente": "George Bonanno, «Loss, trauma, and human resilience», American Psychologist, 2004", "fid": "adaptación", "reflexion": "Si hoy te sientes sin fuerzas, no significa que no las vayas a recuperar: la investigación muestra que la recuperación es el camino más frecuente."},
  {"cats": ["esperanza", "sentido"], "tipo": "practica", "trad": "Psicología positiva", "titulo": "Mi mejor futuro posible", "texto": "Durante 20 minutos, escribe cómo sería tu vida si todo saliera lo mejor posible en el futuro. Sé realista, pero optimista.", "fuente": "Laura King, «The health benefits of writing about life goals», Personality and Social Psychology Bulletin, 2001", "fid": "adaptación", "reflexion": "En ese estudio, quienes escribieron sobre su mejor futuro posible reportaron luego mejor ánimo y bienestar.", "practica": "Haz el ejercicio hoy y subraya una frase de lo que escribiste que puedas empezar a hacer esta semana."},
  {"cats": ["esperanza", "tristeza"], "tipo": "frase", "trad": "Tradición judía y cristiana", "titulo": "¿Por qué te abates, alma mía?", "texto": "¿Por qué te abates, oh alma mía, y te conturbas dentro de mí? Espera en Dios; porque aún he de alabarle.", "fuente": "Salmo 42:5 (fragmento)", "fid": "adaptación", "reflexion": "El salmista se habla a sí mismo, igual que cuando nos decimos a nosotros mismos que esto también va a pasar."},
  {"cats": ["paz"], "tipo": "frase", "trad": "Tradición judía y cristiana", "titulo": "Estad quietos", "texto": "Estad quietos, y conoced que yo soy Dios.", "fuente": "Salmo 46:10 (fragmento), Reina-Valera (1909)", "fid": "textual", "reflexion": "Una invitación a detenerse. Para muchas personas la quietud es una forma de oración y de volver al centro."},
  {"cats": ["paz"], "tipo": "frase", "trad": "Taoísmo", "titulo": "Alcanzar la quietud", "texto": "Llega al máximo vacío; mantén la quietud profunda. Las miles de cosas surgen, y yo contemplo su retorno.", "fuente": "Lao Tse, Tao Te Ching, cap. 16", "fid": "adaptación", "reflexion": "En el taoísmo la calma no se fuerza: aparece cuando soltamos el ruido y miramos cómo todo va y vuelve."},
  {"cats": ["paz", "ansiedad"], "tipo": "idea", "trad": "Estoicismo", "titulo": "El refugio está dentro", "texto": "Los hombres buscan retiros en el campo, en la playa o en las montañas; pero puedes retirarte dentro de ti mismo en cualquier momento.", "fuente": "Marco Aurelio, Meditaciones, IV, 3", "fid": "adaptación", "reflexion": "No siempre se puede viajar a un lugar de calma, pero sí volver a la propia respiración y a los propios valores.", "practica": "Tómate dos minutos hoy: cierra los ojos, respira lento y recuerda un lugar donde te sentiste en paz."},
  {"cats": ["paz"], "tipo": "practica", "trad": "Budismo", "titulo": "Caminar con atención", "texto": "Camina despacio unos minutos, sintiendo cada paso: el talón, la planta, los dedos. Cuando la mente se vaya, vuelve a los pies, sin reproche.", "fuente": "Thich Nhat Hanh, La paz está en cada paso (Peace Is Every Step, 1991)", "fid": "adaptación", "reflexion": "La paz no siempre pide un cojín de meditación: se puede practicar caminando hacia el trabajo o dando una vuelta a la cuadra."},
  {"cats": ["paz", "ansiedad"], "tipo": "practica", "trad": "Mindfulness", "titulo": "Recorrer el cuerpo", "texto": "Recostado, lleva la atención a cada parte del cuerpo, de los pies a la cabeza, durante unos 10 minutos. Observa lo que sientes sin intentar cambiarlo.", "fuente": "Jon Kabat-Zinn, Full Catastrophe Living (1990), programa MBSR", "fid": "adaptación", "reflexion": "Aprender a notar el cuerpo ayuda a salir de la cabeza y a reconocer la tensión antes de que crezca."},
  {"cats": ["paz"], "tipo": "practica", "trad": "Zen", "titulo": "Contar las respiraciones", "texto": "Siéntate cómodo y cuenta cada exhalación del 1 al 10; al llegar a 10 vuelve a empezar. Si te pierdes, comienza otra vez sin regañarte.", "fuente": "Práctica de meditación Zen (conteo de respiraciones, susokukan)", "fid": "adaptación", "reflexion": "Es una de las formas más simples de entrenar la atención. Perderse y volver es, justamente, el ejercicio.", "practica": "Pruébalo cinco minutos hoy, sin esperar nada."},
  {"cats": ["paz"], "tipo": "frase", "trad": "Tradición cristiana", "titulo": "Una paz distinta", "texto": "La paz os dejo, mi paz os doy; no os la doy como el mundo la da.", "fuente": "Juan 14:27", "fid": "adaptación", "reflexion": "Habla de una paz que no depende de que todo esté bien afuera, sino de algo más hondo."},
  {"cats": ["paz", "soledad"], "tipo": "frase", "trad": "Judaísmo", "titulo": "Amar la paz y buscarla", "texto": "Sé de los discípulos de Aarón: ama la paz y busca la paz; ama a las personas y acércalas a la enseñanza.", "fuente": "Pirké Avot (Ética de los Padres), 1:12, Hilel", "fid": "adaptación", "reflexion": "La paz se busca activamente, también en los gestos pequeños del trato diario."},
  {"cats": ["paz", "ansiedad"], "tipo": "frase", "trad": "Hinduismo", "titulo": "Ecuanimidad", "texto": "Sé ecuánime ante el éxito y el fracaso; a esa ecuanimidad se le llama yoga.", "fuente": "Bhagavad Gita, 2:48", "fid": "adaptación", "reflexion": "No se pide no sentir alegría o tristeza, sino no dejar que el resultado defina nuestro valor ni nuestra calma."},
  {"cats": ["paz", "ansiedad"], "tipo": "frase", "trad": "Estoicismo", "titulo": "Guiado o arrastrado", "texto": "Al que acepta, el destino lo guía; al que se resiste, lo arrastra.", "fuente": "Séneca, Cartas a Lucilio, Carta 107 (citando a Cleantes)", "fid": "adaptación", "reflexion": "No habla de resignarse sin más, sino de dejar de gastar fuerzas peleando contra lo que ya no se puede cambiar."},
  {"cats": ["amor"], "tipo": "frase", "trad": "Budismo", "titulo": "Cuidarse con cariño", "texto": "Si uno se tiene por querido, que se cuide bien.", "fuente": "Dhammapada, verso 157", "fid": "adaptación", "reflexion": "Cuidarte no es egoísmo: es la base para poder cuidar a otros."},
  {"cats": ["amor", "culpa"], "tipo": "idea", "trad": "Budismo", "titulo": "Nadie más querido que uno mismo", "texto": "Recorriendo con la mente todas las direcciones, no encontré a nadie más querido que uno mismo; por eso, quien se ama a sí mismo no debe dañar a otros.", "fuente": "Samyutta Nikaya 3.8 (Mallika Sutta)", "fid": "adaptación", "reflexion": "Si cada persona se quiere tanto como tú, la compasión hacia otros nace de reconocerlo."},
  {"cats": ["amor"], "tipo": "frase", "trad": "Tradición judía y cristiana", "titulo": "Como a ti mismo", "texto": "Amarás a tu prójimo como a ti mismo.", "fuente": "Levítico 19:18", "fid": "adaptación", "reflexion": "La frase da por hecho que nos queremos un poco. Si no es así, tal vez toque empezar por ahí."},
  {"cats": ["amor"], "tipo": "idea", "trad": "Filosofía griega", "titulo": "Amor propio sano", "texto": "La persona buena debe ser amante de sí misma, porque obrando bien se beneficia y beneficia a los demás.", "fuente": "Aristóteles, Ética a Nicómaco, IX, 8", "fid": "adaptación", "reflexion": "Aristóteles distingue el amor propio sano, que busca lo mejor de uno, de la mera búsqueda de placer o de poder."},
  {"cats": ["amor"], "tipo": "idea", "trad": "Psicología", "titulo": "Las tres partes de la autocompasión", "texto": "La autocompasión tiene tres partes: ser amable contigo en lugar de criticarte, recordar que sufrir es parte de la experiencia humana común, y mirar tus emociones con atención, sin exagerarlas ni negarlas.", "fuente": "Kristin Neff, Self-Compassion (2011)", "fid": "adaptación", "reflexion": "Neff investiga cómo tratarnos con amabilidad se relaciona con más resiliencia y menos autocrítica dañina."},
  {"cats": ["amor", "culpa"], "tipo": "practica", "trad": "Psicología", "titulo": "Carta desde un amigo sabio", "texto": "Escribe una carta a ti mismo desde la voz de un amigo muy sabio y cariñoso, que conoce todas tus debilidades y te quiere de todos modos.", "fuente": "Kristin Neff, Self-Compassion (2011)", "fid": "adaptación", "reflexion": "Solemos ser más amables con los demás que con nosotros. Esta carta ayuda a cambiar el tono de la voz interior.", "practica": "Léela en voz alta y guárdala para volver a ella en días difíciles."},
  {"cats": ["amor", "sentido"], "tipo": "frase", "trad": "Confucianismo", "titulo": "Estudiar para mejorarse", "texto": "Los antiguos estudiaban para mejorarse a sí mismos; los de hoy, para impresionar a los demás.", "fuente": "Confucio, Analectas, XIV, 25", "fid": "adaptación", "reflexion": "Una invitación a hacer las cosas para crecer, no para aparentar, y a medirse con la propia vara y no con la ajena."},
  {"cats": ["amor"], "tipo": "frase", "trad": "Budismo", "titulo": "Uno es su propio refugio", "texto": "Uno mismo es su propio refugio; ¿qué otro refugio podría haber?", "fuente": "Dhammapada, verso 160", "fid": "adaptación", "reflexion": "No habla de aislarse, sino de cultivar una base interior firme desde la que se pueda también recibir ayuda."},
  {"cats": ["tristeza", "esperanza"], "tipo": "frase", "trad": "Taoísmo", "titulo": "El vendaval no dura toda la mañana", "texto": "Un viento fuerte no dura toda la mañana; un aguacero no dura todo el día.", "fuente": "Lao Tse, Tao Te Ching, cap. 23", "fid": "adaptación", "reflexion": "Hasta las tormentas más fuertes terminan. La tristeza también cambia de intensidad con el tiempo."},
  {"cats": ["tristeza", "paz"], "tipo": "practica", "trad": "Psicología", "titulo": "Salir a caminar entre árboles", "texto": "Sal a caminar por un parque o una zona con árboles, sin audífonos si puedes, y observa los sonidos, la luz y el movimiento de las hojas.", "fuente": "Bratman, Hamilton, Hahn, Daily y Gross, «Nature experience reduces rumination», PNAS, 2015", "fid": "adaptación", "reflexion": "En el estudio, caminar 90 minutos en la naturaleza redujo la rumiación (darle vueltas a lo mismo) más que caminar por la ciudad.", "practica": "No necesitas 90 minutos: empieza con 15 o 20, y aumenta si te sienta bien."},
  {"cats": ["tristeza", "esperanza"], "tipo": "frase", "trad": "Tradición judía y cristiana", "titulo": "Sembrar con lágrimas", "texto": "Los que sembraron con lágrimas, con regocijo segarán.", "fuente": "Salmo 126:5", "fid": "adaptación", "reflexion": "El llanto no es el final de la historia: puede ser parte de la siembra de algo que luego florece."},
  {"cats": ["vacio"], "tipo": "frase", "trad": "Estoicismo", "titulo": "Mientras aplazamos, la vida pasa", "texto": "Mientras aplazamos, la vida pasa.", "fuente": "Séneca, Cartas a Lucilio, Carta 1", "fid": "adaptación", "reflexion": "No es un reproche, sino una invitación amable a hacer hoy algo pequeño en lugar de esperar al momento perfecto."},
  {"cats": ["vacio", "soledad"], "tipo": "practica", "trad": "Psicología positiva", "titulo": "Cinco gestos de bondad", "texto": "Elige un día a la semana y haz cinco pequeños actos de bondad: ayudar a un vecino, escribir un mensaje cariñoso, ceder el asiento, invitar un café.", "fuente": "Lyubomirsky, Sheldon y Schkade, «Pursuing happiness», Review of General Psychology, 2005", "fid": "adaptación", "reflexion": "En ese estudio, quienes concentraron sus actos de bondad en un solo día reportaron más bienestar que quienes no los hicieron.", "practica": "Elige tu día y haz el primer gesto hoy mismo."},
  {"cats": ["vacio", "paz"], "tipo": "frase", "trad": "Taoísmo", "titulo": "Dejar que el lodo se asiente", "texto": "¿Quién puede aquietar lo turbio y, poco a poco, aclararlo?", "fuente": "Lao Tse, Tao Te Ching, cap. 15", "fid": "adaptación", "reflexion": "El agua turbia se aclara cuando se deja quieta. Cuando todo está revuelto por dentro, a veces no hay que hacer más, sino esperar con calma."},
  {"cats": ["amargura", "ira"], "tipo": "frase", "trad": "Budismo", "titulo": "La mente va primero", "texto": "La mente precede a los estados mentales. Si uno habla o actúa con mente impura, el sufrimiento lo sigue como la rueda sigue al buey.", "fuente": "Dhammapada, verso 1 (Buda)", "fid": "adaptación", "reflexion": "El primer verso del Dhammapada pone el origen de lo que vivimos en lo que pensamos. Cuidar los pensamientos es cuidar la vida."},
  {"cats": ["amargura"], "tipo": "frase", "trad": "Tradición judía y cristiana", "titulo": "El corazón apacible", "texto": "El corazón apacible es vida de la carne; mas la envidia es carcoma de los huesos.", "fuente": "Proverbios 14:30", "fid": "adaptación", "reflexion": "Un proverbio antiguo sobre cómo la envidia y el resentimiento desgastan al propio cuerpo y ánimo."},
  {"cats": ["amargura", "vacio"], "tipo": "idea", "trad": "Psicología", "titulo": "Darle vueltas alarga el malestar", "texto": "Pensar una y otra vez en lo que nos molesta suele alargar el malestar. Ayuda cambiar el foco: moverse, ayudar a alguien o hacer algo que absorba la atención.", "fuente": "Susan Nolen-Hoeksema, «Responses to depression and their effects on the duration of depressive episode», Journal of Abnormal Psychology, 1991", "fid": "adaptación", "reflexion": "La rumiación se siente como resolver, pero casi nunca resuelve. Distraerse con algo útil rompe el ciclo.", "practica": "Cuando notes que le das vueltas, levántate y haz algo con las manos durante 10 minutos."},
  {"cats": ["amargura", "culpa"], "tipo": "practica", "trad": "Psicología", "titulo": "Lo que le diría a un amigo", "texto": "Si un amigo te contara esta misma situación, ¿qué le dirías? Escríbelo y léelo como si fuera para ti.", "fuente": "Reestructuración cognitiva: Aaron T. Beck, Terapia cognitiva de la depresión (1979)", "fid": "adaptación", "reflexion": "Con otros solemos ser más justos y comprensivos que con nosotros. Cambiar de perspectiva da una mirada más equilibrada."},
  {"cats": ["ira"], "tipo": "frase", "trad": "Tradición judía y cristiana", "titulo": "No te apresures a enojarte", "texto": "No te apresures en tu espíritu a enojarte; porque la ira reposa en el seno de los necios.", "fuente": "Eclesiastés 7:9", "fid": "adaptación", "reflexion": "La prisa es el combustible de la ira. Un momento de espera cambia lo que sigue."},
  {"cats": ["ira"], "tipo": "frase", "trad": "Tradición judía y cristiana", "titulo": "Más fuerte que una ciudad", "texto": "Mejor es el que tarda en airarse que el fuerte; y el que se enseñorea de su espíritu, que el que toma una ciudad.", "fuente": "Proverbios 16:32", "fid": "adaptación", "reflexion": "La verdadera fortaleza se mide en dominio propio, no en imponerse a otros."},
  {"cats": ["ira"], "tipo": "idea", "trad": "Filosofía griega", "titulo": "Enojarse con medida", "texto": "Cualquiera puede enojarse, eso es fácil; pero enojarse con la persona adecuada, en el grado adecuado, en el momento adecuado, con el propósito adecuado y de la forma adecuada, eso no es fácil.", "fuente": "Aristóteles, Ética a Nicómaco, II, 9", "fid": "adaptación", "reflexion": "Aristóteles no condena el enojo: pide que sea proporcionado y bien dirigido."},
  {"cats": ["ira", "paz"], "tipo": "practica", "trad": "Psicología", "titulo": "Pausa de 20 minutos", "texto": "Cuando sientas que la rabia te desborda, avisa que necesitas un respiro, aléjate unos 20 minutos haciendo algo que te calme (caminar, respirar), y retoma la conversación después.", "fuente": "John Gottman, The Seven Principles for Making Marriage Work (1999)", "fid": "adaptación", "reflexion": "Con el cuerpo muy acelerado, pensar con claridad es casi imposible. El cuerpo necesita tiempo para bajar de revoluciones.", "practica": "No uses el tiempo para repasar la discusión; intenta distraerte con algo tranquilo."},
  {"cats": ["ira"], "tipo": "frase", "trad": "Islam", "titulo": "El fuerte se domina", "texto": "El fuerte no es el que derriba a los demás, sino el que se controla cuando está enojado.", "fuente": "Hadiz recogido por al-Bujari (6114) y Muslim (2609)", "fid": "adaptación", "reflexion": "Muchas tradiciones coinciden: la fuerza interior vale más que la fuerza física."},
  {"cats": ["culpa"], "tipo": "frase", "trad": "Tradición judía y cristiana", "titulo": "Un corazón limpio", "texto": "Crea en mí, oh Dios, un corazón limpio; y renueva un espíritu recto dentro de mí.", "fuente": "Salmo 51:10", "fid": "adaptación", "reflexion": "Una oración de arrepentimiento y renovación: pedir no solo perdón, sino un corazón nuevo."},
  {"cats": ["culpa"], "tipo": "idea", "trad": "Judaísmo", "titulo": "Teshuvá: volver", "texto": "Teshuvá significa «regresar». Para Maimónides, arrepentirse implica reconocer el error, sentir pesar, resolver no repetirlo y, cuando es posible, reparar el daño y pedir perdón.", "fuente": "Maimónides, Mishné Torá, Leyes de Teshuvá, 2:2", "fid": "adaptación", "reflexion": "Cambiar no es solo sentirse mal: es volver a un camino mejor con acciones concretas.", "practica": "Elige una acción concreta de reparación que puedas hacer esta semana."},
  {"cats": ["culpa", "perdon"], "tipo": "practica", "trad": "Psicología", "titulo": "Cómo pedir perdón", "texto": "Una disculpa sincera suele incluir reconocer lo que hiciste, explicar sin excusarte, expresar arrepentimiento y ofrecer reparar el daño.", "fuente": "Aaron Lazare, On Apology (2004)", "fid": "adaptación", "reflexion": "Más que palabras bonitas, una disculpa útil le devuelve dignidad a quien fue herido.", "practica": "Redacta tu disculpa con esos cuatro elementos y decide si enviarla o decirla en persona."},
  {"cats": ["culpa", "amor"], "tipo": "idea", "trad": "Psicología", "titulo": "Culpa y vergüenza no son lo mismo", "texto": "La culpa dice «hice algo malo» y puede impulsar a reparar; la vergüenza dice «soy malo» y suele llevar a esconderse o a atacar. Distinguirlas ayuda a cambiar de verdad.", "fuente": "June Tangney y Ronda Dearing, Shame and Guilt (2002)", "fid": "adaptación", "reflexion": "Sentir culpa por un acto es una señal útil; castigarnos con vergüenza como persona rara vez nos mejora."},
  {"cats": ["culpa"], "tipo": "frase", "trad": "Estoicismo", "titulo": "Si no es justo, no lo hagas", "texto": "Si no es correcto, no lo hagas; si no es verdad, no lo digas.", "fuente": "Marco Aurelio, Meditaciones, XII, 17", "fid": "adaptación", "reflexion": "Una regla sencilla para vivir con integridad: antes de actuar o hablar, preguntarse si es correcto y verdadero."},
  {"cats": ["ansiedad"], "tipo": "idea", "trad": "Estoicismo", "titulo": "No cargues con toda la vida", "texto": "No dejes que tu mente se agobie con la imagen de toda tu vida. No pienses en todas las dificultades que pudieron o pueden venir; pregúntate en cada una: ¿qué hay en esto que no pueda soportar?", "fuente": "Marco Aurelio, Meditaciones, VIII, 36", "fid": "adaptación", "reflexion": "Separar el momento presente del futuro imaginado reduce la carga: solo hay que atravesar un paso a la vez."},
  {"cats": ["ansiedad"], "tipo": "practica", "trad": "Psicología", "titulo": "Una cita con la preocupación", "texto": "Elige 15 minutos al día, siempre a la misma hora, para preocuparte. Si una preocupación aparece fuera de ese momento, anótala y pospónla para tu cita.", "fuente": "Borkovec, Wilkinson, Folensbee y Lerman, «Stimulus control applications to the treatment of worry», Behaviour Research and Therapy, 1983", "fid": "adaptación", "reflexion": "Postergar las preocupaciones ayuda a dejar de vivir en ellas todo el día. Muchas ya no parecen tan urgentes al llegar la cita."},
  {"cats": ["ansiedad", "paz"], "tipo": "practica", "trad": "Psicología", "titulo": "Tensar y soltar", "texto": "Recorre el cuerpo: tensa un grupo muscular (manos, brazos, hombros, cara, piernas) 5 segundos y suéltalo 10, notando la diferencia.", "fuente": "Edmund Jacobson, Progressive Relaxation (1938)", "fid": "adaptación", "reflexion": "Al notar el contraste entre tensión y descanso, el cuerpo aprende a relajarse.", "practica": "Haz una ronda completa antes de dormir."},
  {"cats": ["ansiedad"], "tipo": "practica", "trad": "Psicología", "titulo": "La escalera de lo que temo", "texto": "Evitar lo que nos asusta suele mantener el miedo. Escribe una escalera de 5 pasos, del más fácil al más difícil, y da hoy solo el primero.", "fuente": "Craske et al., «Maximizing exposure therapy: an inhibitory learning approach», Behaviour Research and Therapy, 2014", "fid": "adaptación", "reflexion": "Acercarse de a poco permite comprobar que podemos tolerar la incomodidad.", "practica": "Si el miedo es muy intenso, hazlo con apoyo de un profesional."},
  {"cats": ["soledad"], "tipo": "idea", "trad": "Literatura espiritual", "titulo": "Dos soledades que se protegen", "texto": "El amor consiste en que dos soledades se protejan, se limiten y se saluden.", "fuente": "Rainer Maria Rilke, Cartas a un joven poeta, Carta 7 (1904)", "fid": "adaptación", "reflexion": "Rilke sugiere que cada quien necesita su espacio interior y que la compañía sana lo respeta."},
  {"cats": ["soledad"], "tipo": "idea", "trad": "Psicología", "titulo": "Los vínculos cuidan la salud", "texto": "Las personas con relaciones sociales más fuertes tienen una probabilidad de supervivencia mayor que quienes están más aisladas, un efecto comparable a otros factores de salud muy conocidos.", "fuente": "Holt-Lunstad, Smith y Layton, «Social relationships and mortality risk», PLoS Medicine, 2010", "fid": "adaptación", "reflexion": "La conexión no es un lujo: es parte de lo que nos mantiene sanos. Buscar compañía es cuidarse.", "practica": "Elige una persona a la que puedas escribir o llamar hoy, aunque sea por cinco minutos."},

  {"cats": ["gratitud", "soledad"], "tipo": "practica", "trad": "Psicología positiva", "titulo": "La visita de gratitud", "texto": "Escribe una carta de agradecimiento a alguien que te ayudó y a quien nunca se lo dijiste bien. Léela en persona, si puedes, o envíasela.", "fuente": "Seligman, Steen, Park y Peterson, «Positive psychology progress», American Psychologist, 2005", "fid": "adaptación", "reflexion": "En ese estudio, la visita de gratitud produjo un aumento notable de la felicidad, que se mantuvo durante semanas.", "practica": "Elige a la persona hoy y escribe los primeros tres renglones."},

];

DATA_FALLBACK.forEach((d,i)=>{ d.id=i+1; });

/* ---------- Conexión con Supabase (lectura pública) ---------- */
const SB_URL = 'https://vgkyoyosjewdygxtnqvu.supabase.co';
const SB_KEY = 'sb_publishable_QOZiGlFdzOcCQtqDqI_I_A_ian2l-pf'; // clave pública: solo permite leer lecturas publicadas
const KNOWN_MOODS = MOODS.map(m=>m.id);
let DATA = (function(){
  try{
    const c = JSON.parse(localStorage.getItem('luz-cache')||'null');
    if(Array.isArray(c) && c.length) return c;
  }catch(e){}
  return DATA_FALLBACK;
})();

/* ---------- Utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');
const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

function load(k,def){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):def; }catch(e){ return def; } }
function save(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
let favs = new Set(load('luz-favs',[]));
let diario = load('luz-diario',[]);
let ejercicios = load('luz-ejercicios',{});
const FEELS = ['Triste','Sin ganas','Con rabia','Ansioso/a','Solo/a','En paz','Agradecido/a'];

/* ---------- Páginas del libro ---------- */
let pages = [], cur = 0, busy = false, delArm = null;
function buildPages(){
  pages = [{t:'cover'},{t:'toc'}];
  MOODS.forEach(m=>{
    pages.push({t:'sec',mood:m.id});
    DATA.filter(d=>d.cats[0]===m.id).forEach(d=>pages.push({t:'lec',id:d.id}));
  });
  pages.push({t:'diario'},{t:'favs'},{t:'end'});
}
const idxSec = m => pages.findIndex(p=>p.t==='sec'&&p.mood===m);
const idxLec = id => pages.findIndex(p=>p.t==='lec'&&p.id===id);
const idxT = t => pages.findIndex(p=>p.t===t);
const typeLabel = t => ({frase:'Frase',idea:'Idea',practica:'Práctica'})[t];

function dailyPick(){
  const pool = DATA.filter(d=>d.tipo!=='practica');
  const d = new Date(); const day = Math.floor(new Date(d.getFullYear(),d.getMonth(),d.getDate())/864e5);
  return pool[day % pool.length];
}

function renderPage(i){
  const p = pages[i];
  if(p.t==='cover') return `
    <div class="frame">
      <div class="orn">✦</div>
      <h1>Luz Interior</h1>
      <p>Un librito para el alma</p>
      <p style="font-size:.85rem">Sabiduría de muchas tradiciones, con sus fuentes</p>
      <div class="open">Toca o desliza para abrir →</div>
    </div>`;
  if(p.t==='toc'){
    const dp = dailyPick();
    return `
     <h2 class="t">Índice</h2>
     <input id="sq" class="search" type="search" placeholder="Busca un tema, autor o tradición…" aria-label="Buscar">
     <div id="sres"></div>
     <div id="chapters">
       <div class="daily"><span class="tag">Para hoy</span><blockquote>“${esc(dp.texto)}”</blockquote><div class="muted">${esc(dp.fuente)}</div>
         <div class="actions"><button class="btn" data-goto="${idxLec(dp.id)}">Leer completa</button></div></div>
       <ul class="list">
         ${MOODS.map(m=>`<li><button data-goto="${idxSec(m.id)}"><span>${esc(m.label)}</span><small>pág. ${idxSec(m.id)+1}</small></button></li>`).join('')}
         <li><button data-goto="${idxT('diario')}"><span>Mi diario</span><small>pág. ${idxT('diario')+1}</small></button></li>
         <li><button data-goto="${idxT('favs')}"><span>♥ Mis favoritos</span><small>pág. ${idxT('favs')+1}</small></button></li>
       </ul>
       <p class="muted">Aquí caben todas las tradiciones y también la ciencia: ninguna está por encima de las otras. Tú eliges lo que te sirve.</p>
     </div>`;
  }
  if(p.t==='sec'){
    const m = MOODS.find(x=>x.id===p.mood);
    const n = DATA.filter(d=>d.cats[0]===m.id).length;
    return `<div class="sec"><div class="orn">✦</div><div class="tag">Capítulo ${MOODS.indexOf(m)+1}</div><div class="big">${esc(m.label)}</div><p>${esc(m.intro)}</p><p class="muted">${n} lecturas · desliza para continuar →</p></div>`;
  }
  if(p.t==='lec'){
    const d = DATA.find(x=>x.id===p.id);
    const others = d.cats.filter(c=>c!==d.cats[0]);
    return `
     <div class="tag">${typeLabel(d.tipo)} · ${esc(d.trad)}</div>
     <h3 class="t">${esc(d.titulo)}</h3>
     <div class="quote ${d.tipo==='frase'?'q':''}">${esc(d.texto)}</div>
     <div class="source">${esc(d.fuente)}<span class="badge">${d.fid}</span></div>
     <p class="refl">${esc(d.reflexion)}</p>
     ${d.practica?`<div class="practice"><strong>Para practicar:</strong> ${esc(d.practica)}</div>
       <div class="ejer"><label>✎ Mi cuaderno (se guarda solo en este dispositivo)</label><textarea aria-label="Mi cuaderno" data-ej="${d.id}" placeholder="Escribe aquí tu ejercicio…">${esc(ejercicios[d.id]||'')}</textarea><div class="st"><span class="ejst">${ejercicios[d.id]?'Guardado ✓':''}</span><button class="mini" data-ej2d="${d.id}">Pasar al diario</button></div></div>`:''}
     ${others.length?`<div class="also">También para:${others.map(c=>`<button class="mini" data-goto="${idxSec(c)}">${esc(MOOD_LABEL[c])}</button>`).join('')}</div>`:''}
     <div class="actions">
       <button class="btn ${favs.has(d.id)?'on':''}" data-fav="${d.id}">${favs.has(d.id)?'♥ Guardado':'♡ Guardar'}</button>
       <button class="btn" data-copy="${d.id}">Copiar</button>
     </div>`;
  }
  if(p.t==='diario'){
    return `
     <h2 class="t">Mi diario</h2>
     <p class="muted">Escribe cómo te sientes o qué te dejó una lectura. Se guarda <strong>solo en este dispositivo</strong>; nadie más lo ve.</p>
     <select id="dFeel" aria-label="Cómo me siento">${FEELS.map(f=>`<option>${f}</option>`).join('')}</select>
     <textarea id="dText" placeholder="Hoy me siento…" style="margin-top:8px"></textarea>
     <div class="actions"><button class="btn primary" data-dsave="1">Guardar entrada</button></div>
     ${diario.length? diario.slice().reverse().map(e=>`
        <div class="entry"><small>${esc(e.fecha)} · ${esc(e.feel)}</small><div>${esc(e.texto).replace(/\n/g,'<br>')}</div>
        <button class="mini" data-del="${e.id}">${delArm===e.id?'Toca otra vez para borrar':'Borrar'}</button></div>`).join('')
       : '<div class="empty">Aún no hay entradas.</div>'}`;
  }
  if(p.t==='favs'){
    const fl = DATA.filter(d=>favs.has(d.id));
    return `<h2 class="t">♥ Mis favoritos</h2>` + (fl.length
      ? `<ul class="list">${fl.map(d=>`<li><button data-goto="${idxLec(d.id)}"><span>${esc(d.titulo)}</span><small>${typeLabel(d.tipo)}</small></button></li>`).join('')}</ul>`
      : '<div class="empty">Cuando guardes una lectura con ♡, aparecerá aquí.</div>');
  }
  if(p.t==='end') return `
     <div class="sec"><div class="orn">✦</div><div class="big">Hasta pronto</div>
     <p>Gracias por detenerte un momento contigo.</p>
     <div class="note"><strong>Una nota con cariño:</strong> este librito acompaña, pero no reemplaza la ayuda profesional. Si la tristeza o el vacío se sienten muy pesados, o piensas en hacerte daño, habla hoy con alguien de confianza o con un profesional de salud. En una emergencia, llama al número de emergencias de tu país (en Costa Rica, el 911).</div>
     <p class="muted">Las lecturas marcadas como <em>adaptación</em> son paráfrasis del sentido original, no citas textuales. Conviene contrastarlas con una edición concreta.</p>
     <button class="btn" data-goto="1">Volver al índice</button></div>`;
  return '';
}

/* ---------- Animación de volteo ---------- */
const topPg = $('#pgTop'), underPg = $('#pgUnder');
function setContent(el,i){
  el.innerHTML = '<div class="inner'+(pages[i].t==='cover'?' cover':'')+'">'+renderPage(i)+'</div>';
  el.scrollTop = 0;
  const sq = el.querySelector('#sq'); if(sq) sq.addEventListener('input', onSearch);
}
function updateBar(){
  $('#prev').disabled = cur===0;
  $('#next').disabled = cur===pages.length-1;
  $('#ind').textContent = cur===0 ? '' : (cur+1)+' / '+pages.length;
  $('#goToc').style.visibility = cur===0 ? 'hidden' : 'visible';
}
function go(n){
  if(busy||n<0||n>=pages.length||n===cur) return;
  busy = true;
  const dir = n>cur?1:-1, dur = reduce?0:520, ease='cubic-bezier(.55,0,.35,1)';
  const shadowOn='6px 0 24px rgba(0,0,0,.35)';
  let a;
  if(dir>0){
    setContent(underPg,n);
    a = topPg.animate([{transform:'rotateY(0deg)',boxShadow:'0 0 0 rgba(0,0,0,0)'},{transform:'rotateY(-110deg)',boxShadow:shadowOn}],{duration:dur,easing:ease,fill:'both'});
    a.onfinish = ()=>{ setContent(topPg,n); a.cancel(); cur=n; busy=false; updateBar(); };
  } else {
    setContent(underPg,cur);
    setContent(topPg,n);
    a = topPg.animate([{transform:'rotateY(-110deg)',boxShadow:shadowOn},{transform:'rotateY(0deg)',boxShadow:'0 0 0 rgba(0,0,0,0)'}],{duration:dur,easing:ease,fill:'both'});
    a.onfinish = ()=>{ a.cancel(); cur=n; busy=false; updateBar(); };
  }
}
function refresh(){ const s=topPg.scrollTop; setContent(topPg,cur); topPg.scrollTop=s; }

/* ---------- Búsqueda en el índice ---------- */
function onSearch(e){
  const q = norm(e.target.value.trim());
  const res = e.target.closest('.inner').querySelector('#sres');
  const chap = e.target.closest('.inner').querySelector('#chapters');
  if(!q){ res.innerHTML=''; chap.style.display=''; return; }
  chap.style.display='none';
  const items = DATA.filter(d=> q.split(/\s+/).every(w=> norm([d.titulo,d.texto,d.reflexion,d.fuente,d.trad,d.practica||'',d.cats.map(c=>MOOD_LABEL[c]).join(' ')].join(' ')).includes(w)));
  res.innerHTML = items.length
    ? `<ul class="list">${items.map(d=>`<li><button data-goto="${idxLec(d.id)}"><span>${esc(d.titulo)}<br><small>${esc(d.trad)}</small></span><small>${typeLabel(d.tipo)}</small></button></li>`).join('')}</ul>`
    : '<div class="empty">No encontré nada con eso. Prueba otra palabra.</div>';
}

/* ---------- Eventos ---------- */
document.addEventListener('click', e=>{
  const g = e.target.closest('[data-goto]'); if(g){ go(+g.dataset.goto); return; }
  const f = e.target.closest('[data-fav]');
  if(f){ const id=+f.dataset.fav; favs.has(id)?favs.delete(id):favs.add(id); save('luz-favs',[...favs]); refresh(); return; }
  const c = e.target.closest('[data-copy]');
  if(c){
    const d = DATA.find(x=>x.id===+c.dataset.copy);
    const txt = `"${d.texto}"\n— ${d.fuente}`;
    try{ navigator.clipboard.writeText(txt).then(()=>{c.textContent='¡Copiado!';setTimeout(()=>c.textContent='Copiar',1400)}).catch(()=>{}); }catch(err){}
    return;
  }
  const e2=e.target.closest('[data-ej2d]');
  if(e2){ const id=e2.dataset.ej2d, ta=e2.closest('.ejer').querySelector('textarea'), t=ta&&ta.value.trim(); const st=ta&&ta.parentNode.querySelector('.ejst');
    if(!t){ if(st) st.textContent='Escribe algo primero'; return; }
    const d=DATA.find(x=>x.id===+id); const now=new Date();
    diario.push({id:Date.now(),fecha:now.toLocaleDateString('es',{day:'numeric',month:'short',year:'numeric'}),feel:'Ejercicio',texto:(d?'['+d.titulo+'] ':'')+t});
    save('luz-diario',diario); if(st) st.textContent='Copiado a tu diario ✓'; return; }
  if(e.target.closest('[data-dsave]')){
    const t = $('#dText').value.trim(); if(!t) return;
    const feel = $('#dFeel').value;
    const now = new Date();
    diario.push({id:Date.now(),fecha:now.toLocaleDateString('es',{day:'numeric',month:'short',year:'numeric'}),feel,texto:t});
    save('luz-diario',diario); refresh(); return;
  }
  const del = e.target.closest('[data-del]');
  if(del){ const id=+del.dataset.del;
    if(delArm===id){ diario = diario.filter(x=>x.id!==id); save('luz-diario',diario); delArm=null; } else { delArm=id; }
    refresh(); return; }
  if(cur===0 && e.target.closest('.cover')) go(1);
});
$('#prev').onclick = ()=>go(cur-1);
$('#next').onclick = ()=>go(cur+1);
$('#goToc').onclick = ()=>go(1);
let ejT=null;
document.addEventListener('input',e=>{
  const t=e.target.closest&&e.target.closest('[data-ej]'); if(!t) return;
  const st=t.parentNode.querySelector('.ejst'); if(st) st.textContent='Escribiendo…';
  clearTimeout(ejT); ejT=setTimeout(()=>{ const v=t.value; if(v.trim()) ejercicios[t.dataset.ej]=v; else delete ejercicios[t.dataset.ej]; save('luz-ejercicios',ejercicios); if(st) st.textContent=v.trim()?'Guardado ✓':''; },400);
});
document.addEventListener('keydown', e=>{
  if(/INPUT|TEXTAREA|SELECT/.test((e.target.tagName||''))) return;
  if(e.key==='ArrowRight') go(cur+1);
  if(e.key==='ArrowLeft') go(cur-1);
});
let sx=0, sy=0, tracking=false;
const stage = document.querySelector('.stage');
stage.addEventListener('touchstart', e=>{ const t=e.touches[0]; sx=t.clientX; sy=t.clientY; tracking=!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName); }, {passive:true});
stage.addEventListener('touchend', e=>{
  if(!tracking) return; const t=e.changedTouches[0]; const dx=t.clientX-sx, dy=t.clientY-sy;
  if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)*1.5){ go(dx<0?cur+1:cur-1); }
}, {passive:true});
let mx=0, mdown=false;
stage.addEventListener('mousedown', e=>{ mx=e.clientX; mdown=!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName); });
stage.addEventListener('mouseup', e=>{ if(!mdown) return; mdown=false; const dx=e.clientX-mx; if(Math.abs(dx)>80){ go(dx<0?cur+1:cur-1); } });

async function loadRemote(){
  try{
    const ctl = new AbortController(); const to = setTimeout(()=>ctl.abort(), 7000);
    const r = await fetch(SB_URL+'/rest/v1/luz_lecturas?select=id,cats,tipo,trad,titulo,texto,fuente,fid,reflexion,practica&publicada=eq.true&order=orden.asc,id.asc',
      {headers:{apikey:SB_KEY}, signal:ctl.signal});
    clearTimeout(to);
    if(!r.ok) return;
    let rows = await r.json();
    if(!Array.isArray(rows)) return;
    rows = rows.filter(d=>Array.isArray(d.cats) && KNOWN_MOODS.includes(d.cats[0]));
    if(!rows.length) return;
    if(JSON.stringify(rows)===JSON.stringify(DATA)) return;
    save('luz-cache', rows);
    // Si el lector aún está en la portada o el índice, actualizamos ya; si no, queda para la próxima vez.
    if(cur<=1 && !busy){
      DATA = rows; buildPages();
      setContent(topPg,cur); setContent(underPg, cur===0?1:0);
      updateBar();
    }
  }catch(e){ /* sin conexión: se usa la copia local */ }
}

buildPages();
setContent(topPg,0);
setContent(underPg,1);
updateBar();
loadRemote();

if('serviceWorker' in navigator && location.protocol.startsWith('http')){
  try{ navigator.serviceWorker.register('sw.js').catch(()=>{}); }catch(e){}
}
</script>
